name: Cloudflare'e deploy et

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # index.html / worker.template.js değişse de src/index.js ve panel/worker.js güncel kalsın
      - name: Build çıktılarını üret
        run: python build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install

      - name: Wrangler ile deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # package-lock.json ile aynı sürüm; belirtilmezse action eski 3.x sürümünü kurar
          wranglerVersion: "4.141.0"
          command: deploy
